<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Proofessor profile autofill</title>
  <desc id="desc">Dark macOS app screenshot showing guided profile setup with extracted identity, themes, links, and selected work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3b32"/>
      <stop offset="0.52" stop-color="#0d100f"/>
      <stop offset="1" stop-color="#060706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="96" y="62" width="1088" height="636" rx="18" fill="#101412" stroke="#f4efe426" filter="url(#shadow)"/>
  <rect x="96" y="62" width="1088" height="42" rx="18" fill="#171c19"/>
  <circle cx="124" cy="83" r="6" fill="#a83f4d"/>
  <circle cx="146" cy="83" r="6" fill="#c7a75a"/>
  <circle cx="168" cy="83" r="6" fill="#5d9b75"/>

  <text x="136" y="150" fill="#f4efe4" font-family="Georgia, serif" font-size="38">Autofill My Profile</text>
  <text x="136" y="184" fill="#aaa293" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Check the profile once. CVs, bios, and dossier paragraphs use it after that.</text>

