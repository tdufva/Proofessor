<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Proofessor export preview</title>
  <desc id="desc">Dark macOS app screenshot showing CV page preview, typography, spacing density, section order, and length warnings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3b32"/>
      <stop offset="0.5" stop-color="#0d100f"/>
      <stop offset="1" stop-color="#060706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="96" y="62" width="1088" height="636" rx="18" fill="#101412" stroke="#f4efe426" filter="url(#shadow)"/>
  <rect x="96" y="62" width="1088" height="42" rx="18" fill="#171c19"/>
  <circle cx="124" cy="83" r="6" fill="#a83f4d"/>
  <circle cx="146" cy="83" r="6" fill="#c7a75a"/>
  <circle cx="168" cy="83" r="6" fill="#5d9b75"/>

  <text x="136" y="150" fill="#f4efe4" font-family="Georgia, serif" font-size="38">Export Preview</text>
  <text x="136" y="184" fill="#aaa293" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">See the page before export: typography, density, section order, page estimate, and warnings.</text>

  <rect x="136" y="222" width="616" height="420" rx="8" fill="#f4efe40d" stroke="#f4efe422"/>
  <rect x="318" y="250" width="252" height="356" rx="3" fill="#f4efe4"/>
  <text x="344" y="292" fill="#101412" font-family="Georgia, serif" font-size="22">Alex Scholar</text>
  <line x1="344" y1="314" x2="546" y2="314" stroke="#c7a75a" stroke-width="2"/>
  <g stroke="#11110d" stroke-opacity="0.26" stroke-width="2">
    <line x1="344" y1="352" x2="540" y2="352"/>
    <line x1="344" y1="374" x2="524" y2="374"/>
    <line x1="344" y1="420" x2="548" y2="420"/>
    <line x1="344" y1="442" x2="532" y2="442"/>
    <line x1="344" y1="464" x2="548" y2="464"/>
    <line x1="344" y1="512" x2="530" y2="512"/>
    <line x1="344" y1="534" x2="546" y2="534"/>
    <line x1="344" y1="556" x2="514" y2="556"/>
  </g>
  <text x="344" y="342" fill="#11110d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700">Profile</text>
  <text x="344" y="410" fill="#11110d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700">Research output</text>
  <text x="344" y="502" fill="#11110d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700">Teaching</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="788" y="222" width="356" height="420" rx="8" fill="#f4efe40d" stroke="#f4efe422"/>
    <text x="816" y="258" fill="#f4efe4" font-family="Georgia, serif" font-size="25">Before exporting</text>
    <rect x="816" y="286" width="102" height="28" rx="6" fill="#5d9b7528"/>
    <text x="834" y="305" fill="#8dd6a6" font-size="13" font-weight="700">2 pages</text>
    <rect x="932" y="286" width="110" height="28" rx="6" fill="#c7a75a2e"/>
    <text x="950" y="305" fill="#d9c89e" font-size="13">Balanced</text>

    <text x="816" y="352" fill="#f4efe4" font-size="16" font-weight="700">Typography</text>
    <text x="816" y="380" fill="#aaa293" font-size="14">Title 23 pt · Heading 14 pt · Body 11 pt</text>

    <text x="816" y="428" fill="#f4efe4" font-size="16" font-weight="700">Section order</text>
    <text x="816" y="456" fill="#aaa293" font-size="14">1. Personal Details</text>
    <text x="816" y="482" fill="#aaa293" font-size="14">2. Profile</text>
    <text x="816" y="508" fill="#aaa293" font-size="14">3. Research / Artistic Work</text>
    <text x="816" y="534" fill="#aaa293" font-size="14">4. Teaching</text>

    <text x="816" y="586" fill="#f4efe4" font-size="16" font-weight="700">Warnings</text>
    <rect x="816" y="602" width="242" height="28" rx="6" fill="#5d9b7528"/>
    <text x="834" y="621" fill="#8dd6a6" font-size="13" font-weight="700">Looks ready</text>
  </g>
</svg>
