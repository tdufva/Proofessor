<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Proofessor dashboard and Aalto criteria coverage</title>
  <desc id="desc">Dark macOS app screenshot showing overview actions, metrics, Aalto criteria presets, and a criteria coverage matrix.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3b32"/>
      <stop offset="0.48" stop-color="#0d100f"/>
      <stop offset="1" stop-color="#060706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="90" y="58" width="1100" height="644" rx="18" fill="#101412" stroke="#f4efe426" filter="url(#shadow)"/>
  <rect x="90" y="58" width="1100" height="42" rx="18" fill="#171c19"/>
  <circle cx="118" cy="79" r="6" fill="#a83f4d"/>
  <circle cx="140" cy="79" r="6" fill="#c7a75a"/>
  <circle cx="162" cy="79" r="6" fill="#5d9b75"/>
  <text x="132" y="150" fill="#f4efe4" font-family="Georgia, serif" font-size="36">Tenure Overview</text>
  <text x="132" y="184" fill="#aaa293" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Scan, review, file proof, build CVs, and export the dossier from one calm place.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="132" y="220" width="206" height="78" rx="8" fill="#f4efe40f" stroke="#f4efe422"/>
    <text x="158" y="252" fill="#f4efe4" font-size="17" font-weight="700">Scan Documents</text>
    <text x="158" y="276" fill="#aaa293" font-size="14">Find files and suggestions</text>
    <rect x="356" y="220" width="206" height="78" rx="8" fill="#f4efe40f" stroke="#f4efe422"/>
    <text x="382" y="252" fill="#f4efe4" font-size="17" font-weight="700">Review Suggestions</text>
    <text x="382" y="276" fill="#aaa293" font-size="14">Accept, edit, or dismiss</text>
    <rect x="580" y="220" width="206" height="78" rx="8" fill="#f4efe40f" stroke="#f4efe422"/>
    <text x="606" y="252" fill="#f4efe4" font-size="17" font-weight="700">Open CV Builder</text>
    <text x="606" y="276" fill="#aaa293" font-size="14">Create CV variants</text>
    <rect x="804" y="220" width="206" height="78" rx="8" fill="#f4efe40f" stroke="#f4efe422"/>
    <text x="830" y="252" fill="#f4efe4" font-size="17" font-weight="700">Dossier</text>
    <text x="830" y="276" fill="#aaa293" font-size="14">Prepare packet export</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="132" y="326" width="148" height="76" rx="8" fill="#f4efe40d"/>
    <text x="154" y="354" fill="#aaa293" font-size="13">Evidence</text>
    <text x="154" y="384" fill="#f4efe4" font-size="30" font-weight="700">24</text>
    <rect x="296" y="326" width="148" height="76" rx="8" fill="#f4efe40d"/>
    <text x="318" y="354" fill="#aaa293" font-size="13">Ready to use</text>
    <text x="318" y="384" fill="#f4efe4" font-size="30" font-weight="700">11</text>
    <rect x="460" y="326" width="148" height="76" rx="8" fill="#f4efe40d"/>
    <text x="482" y="354" fill="#aaa293" font-size="13">Needs attention</text>
    <text x="482" y="384" fill="#f4efe4" font-size="30" font-weight="700">5</text>
  </g>
  <rect x="132" y="430" width="1004" height="88" rx="8" fill="#f4efe40f" stroke="#f4efe422"/>
  <text x="160" y="462" fill="#f4efe4" font-family="Georgia, serif" font-size="24">Aalto Criteria Presets</text>
  <rect x="160" y="482" width="142" height="26" rx="6" fill="#c7a75a2e"/>
  <text x="178" y="500" fill="#d9c89e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">School: ARTS</text>
  <rect x="318" y="482" width="188" height="26" rx="6" fill="#c7a75a2e"/>
  <text x="336" y="500" fill="#d9c89e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Stage: Tenure review</text>
  <text x="548" y="500" fill="#aaa293" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Excellence in research/artistic work or teaching, with high quality in the other dimension.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="132" y="546" width="310" height="104" rx="8" fill="#5d9b7518" stroke="#5d9b7550"/>
    <text x="158" y="576" fill="#f4efe4" font-size="17" font-weight="700">Research / Artistic Quality</text>
    <text x="158" y="608" fill="#aaa293" font-size="14">9 total · 6 proof · 4 ready</text>
    <text x="158" y="632" fill="#8dd6a6" font-size="14">Covered</text>
    <rect x="464" y="546" width="310" height="104" rx="8" fill="#f0a23a17" stroke="#f0a23a50"/>
    <text x="490" y="576" fill="#f4efe4" font-size="17" font-weight="700">Teaching Development</text>
    <text x="490" y="608" fill="#aaa293" font-size="14">5 total · 2 proof · 1 ready</text>
    <text x="490" y="632" fill="#e9a34d" font-size="14">Review</text>
    <rect x="796" y="546" width="310" height="104" rx="8" fill="#f0a23a17" stroke="#f0a23a50"/>
    <text x="822" y="576" fill="#f4efe4" font-size="17" font-weight="700">Impact / Service</text>
    <text x="822" y="608" fill="#aaa293" font-size="14">3 total · 0 proof · 0 ready</text>
    <text x="822" y="632" fill="#e9a34d" font-size="14">Proof needed</text>
  </g>
</svg>
