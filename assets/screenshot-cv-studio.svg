<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Proofessor CV Design Studio</title>
  <desc id="desc">Dark macOS app screenshot showing purpose-first CV design choices and a live preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3b32"/>
      <stop offset="0.54" stop-color="#0d100f"/>
      <stop offset="1" stop-color="#060706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="96" y="62" width="1088" height="636" rx="18" fill="#101412" stroke="#f4efe426" filter="url(#shadow)"/>
  <rect x="96" y="62" width="1088" height="42" rx="18" fill="#171c19"/>
  <circle cx="124" cy="83" r="6" fill="#a83f4d"/>
  <circle cx="146" cy="83" r="6" fill="#c7a75a"/>
  <circle cx="168" cy="83" r="6" fill="#5d9b75"/>

  <text x="136" y="150" fill="#f4efe4" font-family="Georgia, serif" font-size="38">Build CV</text>
  <text x="136" y="184" fill="#aaa293" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Choose the purpose. The app picks the structure, typography, density, and export defaults.</text>

  <rect x="136" y="220" width="632" height="400" rx="8" fill="#f4efe40d" stroke="#f4efe422"/>
  <text x="164" y="258" fill="#f4efe4" font-family="Georgia, serif" font-size="25">CV Design Studio</text>
  <text x="164" y="286" fill="#aaa293" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Pick the audience instead of adjusting formatting controls.</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="164" y="318" width="178" height="86" rx="8" fill="#c7a75a24" stroke="#c7a75aaa"/>
    <text x="184" y="348" fill="#f4efe4" font-size="16" font-weight="700">Aalto/TENK</text>
    <text x="184" y="374" fill="#aaa293" font-size="13">Formal evaluator CV</text>
    <text x="184" y="392" fill="#d9c89e" font-size="12">TENK formal</text>

    <rect x="362" y="318" width="178" height="86" rx="8" fill="#f4efe40f" stroke="#f4efe422"/>
    <text x="382" y="348" fill="#f4efe4" font-size="16" font-weight="700">Academic</text>
    <text x="382" y="374" fill="#aaa293" font-size="13">Balanced full profile</text>
    <text x="382" y="392" fill="#d9c89e" font-size="12">Clean academic</text>

    <rect x="560" y="318" width="178" height="86" rx="8" fill="#f4efe40f" stroke="#f4efe422"/>
    <text x="580" y="348" fill="#f4efe4" font-size="16" font-weight="700">Research</text>
    <text x="580" y="374" fill="#aaa293" font-size="13">Publications, grants</text>
    <text x="580" y="392" fill="#d9c89e" font-size="12">Research brief</text>

    <rect x="164" y="424" width="178" height="86" rx="8" fill="#f4efe40f" stroke="#f4efe422"/>
    <text x="184" y="454" fill="#f4efe4" font-size="16" font-weight="700">Artistic portfolio</text>
    <text x="184" y="480" fill="#aaa293" font-size="13">Exhibitions, projects</text>
    <text x="184" y="498" fill="#d9c89e" font-size="12">Art portfolio</text>

    <rect x="362" y="424" width="178" height="86" rx="8" fill="#f4efe40f" stroke="#f4efe422"/>
    <text x="382" y="454" fill="#f4efe4" font-size="16" font-weight="700">Teaching</text>
    <text x="382" y="480" fill="#aaa293" font-size="13">Courses, supervision</text>
    <text x="382" y="498" fill="#d9c89e" font-size="12">Clean academic</text>

    <rect x="560" y="424" width="178" height="86" rx="8" fill="#f4efe40f" stroke="#f4efe422"/>
    <text x="580" y="454" fill="#f4efe4" font-size="16" font-weight="700">2-page compact</text>
    <text x="580" y="480" fill="#aaa293" font-size="13">Strongest proof only</text>
    <text x="580" y="498" fill="#d9c89e" font-size="12">Compact</text>

    <rect x="164" y="536" width="374" height="48" rx="8" fill="#5d9b751e" stroke="#5d9b7555"/>
    <text x="184" y="566" fill="#8dd6a6" font-size="14" font-weight="700">Profile ready</text>
    <text x="292" y="566" fill="#aaa293" font-size="14">CVs, bios, and dossier text can use saved context.</text>
  </g>

  <rect x="812" y="220" width="300" height="400" rx="8" fill="#f4efe40d" stroke="#f4efe422"/>
  <text x="840" y="258" fill="#f4efe4" font-family="Georgia, serif" font-size="25">Live Preview</text>
  <rect x="856" y="292" width="212" height="286" rx="3" fill="#f4efe4"/>
  <text x="878" y="326" fill="#101412" font-family="Georgia, serif" font-size="19">Candidate Name</text>
  <line x1="878" y1="344" x2="1046" y2="344" stroke="#c7a75a" stroke-width="2"/>
  <text x="878" y="372" fill="#11110d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700">Personal Details</text>
  <text x="878" y="398" fill="#11110d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9">Aalto University · ORCID · Scholar</text>
  <text x="878" y="430" fill="#11110d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700">Research / Artistic Work</text>
  <line x1="878" y1="450" x2="1044" y2="450" stroke="#11110d" stroke-opacity="0.28"/>
  <line x1="878" y1="470" x2="1032" y2="470" stroke="#11110d" stroke-opacity="0.24"/>
  <line x1="878" y1="490" x2="1048" y2="490" stroke="#11110d" stroke-opacity="0.24"/>
  <text x="878" y="526" fill="#11110d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700">Teaching</text>
  <line x1="878" y1="546" x2="1038" y2="546" stroke="#11110d" stroke-opacity="0.24"/>
</svg>
