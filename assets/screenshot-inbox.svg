<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Proofessor review inbox</title>
  <desc id="desc">Dark macOS app screenshot showing selected suggestions, Aalto criteria presets, confidence notes, proof status, why the app found this, and batch review actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3b32"/>
      <stop offset="0.5" stop-color="#0d100f"/>
      <stop offset="1" stop-color="#060706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="96" y="62" width="1088" height="636" rx="18" fill="#101412" stroke="#f4efe426" filter="url(#shadow)"/>
  <rect x="96" y="62" width="1088" height="42" rx="18" fill="#171c19"/>
  <circle cx="124" cy="83" r="6" fill="#a83f4d"/>
  <circle cx="146" cy="83" r="6" fill="#c7a75a"/>
  <circle cx="168" cy="83" r="6" fill="#5d9b75"/>
  <text x="136" y="152" fill="#f4efe4" font-family="Georgia, serif" font-size="36">Evidence Review Inbox</text>
  <text x="136" y="185" fill="#aaa293" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Review evidence, proof, missing pieces, and why the app found it.</text>
  <rect x="136" y="216" width="1008" height="124" rx="8" fill="#f4efe40f" stroke="#f4efe422"/>
  <rect x="162" y="242" width="338" height="34" rx="7" fill="#f4efe414" stroke="#f4efe422"/>
  <text x="185" y="264" fill="#f4efe4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">All</text>
  <text x="267" y="264" fill="#aaa293" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Duplicates</text>
  <text x="384" y="264" fill="#aaa293" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Proof Needed</text>
  <rect x="650" y="242" width="146" height="34" rx="7" fill="#c7a75a"/>
  <text x="674" y="264" fill="#10110d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700">Select Visible</text>
  <rect x="820" y="242" width="180" height="34" rx="7" fill="#f4efe414" stroke="#f4efe422"/>
  <text x="842" y="264" fill="#f4efe4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">School: Aalto-wide</text>
  <rect x="162" y="292" width="220" height="28" rx="6" fill="#c7a75a2e"/>
  <text x="180" y="311" fill="#d9c89e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">2 selected</text>
  <rect x="400" y="292" width="150" height="28" rx="6" fill="#c7a75a"/>
  <text x="418" y="311" fill="#10110d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">Accept</text>
  <rect x="564" y="292" width="142" height="28" rx="6" fill="#f4efe414" stroke="#f4efe422"/>
  <text x="584" y="311" fill="#f4efe4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Proof Needed</text>
  <rect x="724" y="292" width="120" height="28" rx="6" fill="#3a1417" stroke="#a83f4d66"/>
  <text x="746" y="311" fill="#f0a0aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Dismiss</text>
  <g>
    <rect x="136" y="366" width="492" height="238" rx="8" fill="#f4efe40d" stroke="#c7a75aaa"/>
    <rect x="164" y="392" width="18" height="18" rx="3" fill="#c7a75a"/>
    <text x="202" y="408" fill="#f4efe4" font-family="Georgia, serif" font-size="24">Invited keynote at design research forum</text>
    <text x="202" y="438" fill="#aaa293" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">08_Talks_Visibility_and_Recognition / keynote.md</text>
    <rect x="202" y="466" width="120" height="26" rx="6" fill="#c7a75a2e"/>
    <text x="218" y="484" fill="#d9c89e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Aalto match</text>
    <text x="202" y="526" fill="#f4efe4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700">Why the app found this</text>
    <text x="202" y="552" fill="#aaa293" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Medium confidence: matched invited, keynote, international.</text>
    <text x="202" y="576" fill="#aaa293" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">File keynote.md, snippet, date, and programme link.</text>
  </g>
  <g>
    <rect x="652" y="366" width="492" height="238" rx="8" fill="#f4efe40d" stroke="#c7a75aaa"/>
    <rect x="680" y="392" width="18" height="18" rx="3" fill="#c7a75a"/>
    <text x="718" y="408" fill="#f4efe4" font-family="Georgia, serif" font-size="24">Course feedback and curriculum update</text>
    <text x="718" y="438" fill="#aaa293" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">04_Teaching_and_Pedagogy / feedback.txt</text>
    <rect x="718" y="466" width="118" height="26" rx="6" fill="#5d9b7530"/>
    <text x="734" y="484" fill="#8dd6a6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Teaching</text>
    <text x="718" y="526" fill="#f4efe4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700">Proof found / missing</text>
    <text x="718" y="552" fill="#aaa293" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">High confidence: matched course, feedback, curriculum.</text>
    <text x="718" y="576" fill="#aaa293" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Needs official feedback export before dossier use.</text>
  </g>
</svg>
