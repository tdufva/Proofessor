<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Proofessor dossier narrative builder</title>
  <desc id="desc">Dark macOS app screenshot showing evidence-backed dossier narrative paragraphs for tenure materials.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3b32"/>
      <stop offset="0.52" stop-color="#0d100f"/>
      <stop offset="1" stop-color="#060706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="96" y="62" width="1088" height="636" rx="18" fill="#101412" stroke="#f4efe426" filter="url(#shadow)"/>
  <rect x="96" y="62" width="1088" height="42" rx="18" fill="#171c19"/>
  <circle cx="124" cy="83" r="6" fill="#a83f4d"/>
  <circle cx="146" cy="83" r="6" fill="#c7a75a"/>
  <circle cx="168" cy="83" r="6" fill="#5d9b75"/>

  <text x="136" y="150" fill="#f4efe4" font-family="Georgia, serif" font-size="38">Dossier Narrative Builder</text>
  <text x="136" y="184" fill="#aaa293" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Generate short paragraphs with the evidence titles and proof warnings visible.</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="136" y="218" width="1008" height="64" rx="8" fill="#f4efe40d" stroke="#f4efe422"/>
    <rect x="164" y="236" width="114" height="28" rx="6" fill="#c7a75a"/>
    <text x="184" y="255" fill="#10110d" font-size="13" font-weight="700">Regenerate</text>
    <rect x="294" y="236" width="86" height="28" rx="6" fill="#f4efe414" stroke="#f4efe422"/>
    <text x="314" y="255" fill="#f4efe4" font-size="13">Copy</text>
    <rect x="998" y="232" width="106" height="36" rx="8" fill="#c7a75a"/>
    <text x="1024" y="255" fill="#10110d" font-size="14" font-weight="700">Export</text>

    <rect x="136" y="318" width="310" height="124" rx="8" fill="#f4efe40d" stroke="#5d9b7550"/>
    <text x="164" y="350" fill="#f4efe4" font-size="17" font-weight="700">Research / Artistic Work</text>
    <text x="164" y="380" fill="#aaa293" font-size="13">Evidence: 5 item(s)</text>
    <text x="164" y="408" fill="#aaa293" font-size="13">Paragraph names research themes, outputs,</text>
    <text x="164" y="428" fill="#aaa293" font-size="13">and proof-backed examples.</text>

    <rect x="486" y="318" width="310" height="124" rx="8" fill="#f4efe40d" stroke="#5d9b7550"/>
    <text x="514" y="350" fill="#f4efe4" font-size="17" font-weight="700">Teaching</text>
    <text x="514" y="380" fill="#aaa293" font-size="13">Evidence: 4 item(s)</text>
    <text x="514" y="408" fill="#aaa293" font-size="13">Course feedback, supervision, curriculum,</text>
    <text x="514" y="428" fill="#aaa293" font-size="13">and development work.</text>

    <rect x="834" y="318" width="310" height="124" rx="8" fill="#f4efe40d" stroke="#f0a23a55"/>
    <text x="862" y="350" fill="#f4efe4" font-size="17" font-weight="700">Impact / Service</text>
    <text x="862" y="380" fill="#e9a34d" font-size="13">2 item(s) still need proof</text>
    <text x="862" y="408" fill="#aaa293" font-size="13">Public impact, service, and peer trust</text>
    <text x="862" y="428" fill="#aaa293" font-size="13">before final polishing.</text>

    <rect x="136" y="476" width="310" height="124" rx="8" fill="#f4efe40d" stroke="#f4efe422"/>
    <text x="164" y="508" fill="#f4efe4" font-size="17" font-weight="700">Future Trajectory</text>
    <text x="164" y="538" fill="#aaa293" font-size="13">Continuity, ambition, feasibility, and</text>
    <text x="164" y="558" fill="#aaa293" font-size="13">fit with the academic environment.</text>

    <rect x="486" y="476" width="310" height="124" rx="8" fill="#f4efe40d" stroke="#f4efe422"/>
    <text x="514" y="508" fill="#f4efe4" font-size="17" font-weight="700">Leadership</text>
    <text x="514" y="538" fill="#aaa293" font-size="13">Project responsibility, mentoring,</text>
    <text x="514" y="558" fill="#aaa293" font-size="13">supervision, and shared work.</text>

    <rect x="834" y="476" width="310" height="124" rx="8" fill="#f4efe40d" stroke="#f4efe422"/>
    <text x="862" y="508" fill="#f4efe4" font-size="17" font-weight="700">International Recognition</text>
    <text x="862" y="538" fill="#aaa293" font-size="13">Invited roles, networks, publications,</text>
    <text x="862" y="558" fill="#aaa293" font-size="13">and visibility outside the local context.</text>
  </g>
</svg>
